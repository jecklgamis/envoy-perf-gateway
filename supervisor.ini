[supervisord]
nodaemon = true
user = root

[program: default-app]
command = /bin/bash -c "exec /run-app.sh"
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program: envoy-perf-gateway]
user = root
command = /bin/bash -c "exec /run-envoy.sh"
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program: config-fetcher]
user = root
directory = /fetcher
command = /bin/bash -c "exec python3 config_fetcher.py"
; CONFIG_SOURCE_KIND / CONFIG_SOURCE_URL / CONFIG_S3_BUCKET / etc. are read
; straight from the container's environment (docker run -e ...) - supervisord
; inherits its own environment and passes it to child programs, so no
; explicit `environment=` directive is needed here.
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

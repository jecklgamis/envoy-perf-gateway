[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewayctl"
version = "0.1.0"
description = "CLI for envoy-perf-gateway: add/remove test backends on a running Envoy gateway"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
build = ["build>=1.2"]

[project.scripts]
gatewayctl = "gatewayctl.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gatewayctl*"]

[tool.setuptools.package-data]
gatewayctl = ["templates/*.j2"]

name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  # Builds and pushes both Docker images tagged with the release version
  # (e.g. v1.2.3) and latest. No path filters here on purpose - a release
  # always rebuilds everything at that tag, regardless of what changed
  # since the last one.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: envoy-perf-gateway
            context: .
          - image: envoy-perf-gateway-config-server
            context: config_server
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Go
        if: matrix.image == 'envoy-perf-gateway'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Render dynamic config (rendered/ is gitignored)
        if: matrix.image == 'envoy-perf-gateway'
        run: |
          cd gatewayctl && go build -o gatewayctl . && cd ..
          ./gatewayctl/gatewayctl render
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Log in to Docker Hub
        if: ${{ github.event.repository.name == 'envoy-perf-gateway' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event.repository.name == 'envoy-perf-gateway' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Cross-compiles gatewayctl for macOS/Linux x arm64/amd64 and attaches
  # the binaries (+ checksums) to a GitHub Release for this tag.
  gatewayctl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Cross-compile gatewayctl
        run: make -C gatewayctl build-all
      - name: Checksums
        run: |
          cd gatewayctl/dist
          shasum -a 256 * > checksums.txt
      # Semver convention: a hyphen after the version core marks a
      # pre-release (v1.0.0-alpha.1, v1.0.0-rc.1, ...); v1.0.0 itself has
      # none, so it's a full release.
      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release with binaries
        if: ${{ github.event.repository.name == 'envoy-perf-gateway' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            gatewayctl/dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.prerelease.outputs.flag }}

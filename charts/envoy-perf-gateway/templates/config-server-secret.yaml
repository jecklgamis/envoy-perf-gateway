{{- if and .Values.configServer.enabled (eq .Values.configSourceKind "http") }}
{{- if not (or .Values.configServer.apiTokenExistingSecret.name .Values.configServer.apiToken) }}
{{- fail "configServer.apiToken or configServer.apiTokenExistingSecret is required when configServer.enabled is true (the server refuses to start without API_TOKEN)" }}
{{- end }}
{{- if not .Values.configServer.apiTokenExistingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envoy-perf-gateway.configServer.fullname" . }}
  labels:
    {{- include "envoy-perf-gateway.configServer.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ .Values.configServer.apiToken | quote }}
{{- end }}
{{- end }}

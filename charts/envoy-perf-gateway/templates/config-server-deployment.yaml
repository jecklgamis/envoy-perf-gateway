{{- if and .Values.configServer.enabled (eq .Values.configSourceKind "http") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envoy-perf-gateway.configServer.fullname" . }}
  labels:
    {{- include "envoy-perf-gateway.configServer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.configServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "envoy-perf-gateway.configServer.selectorLabels" . | nindent 6 }}
  strategy:
    # ReadWriteOnce storage/ volume - avoid two writers.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "envoy-perf-gateway.configServer.labels" . | nindent 8 }}
      {{- with .Values.configServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.configServer.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-server
          image: "{{ .Values.configServer.image.repository }}:{{ .Values.configServer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.configServer.image.pullPolicy }}
          {{- with .Values.configServer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.configServer.apiTokenExistingSecret.name }}
                  name: {{ .Values.configServer.apiTokenExistingSecret.name }}
                  key: {{ .Values.configServer.apiTokenExistingSecret.key }}
                  {{- else }}
                  name: {{ include "envoy-perf-gateway.configServer.fullname" . }}
                  key: api-token
                  {{- end }}
            - name: CONFIG_SERVER_STORAGE_DIR
              value: /data
          volumeMounts:
            - name: storage
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          {{- with .Values.configServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: storage
          {{- if .Values.configServer.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.configServer.persistence.existingClaim | default (include "envoy-perf-gateway.configServer.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.configServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.configServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.configServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

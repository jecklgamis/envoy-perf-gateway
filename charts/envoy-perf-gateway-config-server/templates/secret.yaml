{{- if not (or .Values.apiTokenExistingSecret.name .Values.apiToken) }}
{{- fail "apiToken or apiTokenExistingSecret is required (the server refuses to start without API_TOKEN)" }}
{{- end }}
{{- if not .Values.apiTokenExistingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envoy-perf-gateway-config-server.fullname" . }}
  labels:
    {{- include "envoy-perf-gateway-config-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ .Values.apiToken | quote }}
{{- end }}

# Default values for envoy-perf-gateway-config-server.

image:
  repository: jecklgamis/envoy-perf-gateway-config-server
  tag: "main"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8090

# -- Required; the server refuses to start without it. Prefer
# apiTokenExistingSecret in anything beyond local/dev use.
apiToken: ""
# -- Existing Secret {name, key} to source the token from instead of
# apiToken.
apiTokenExistingSecret: {}
# name: ""
# key: ""

persistence:
  # -- Persists uploaded cds.yaml/lds.yaml/runtime.yaml across restarts.
  # Disable only for ephemeral/dev use - a pod restart with this off loses
  # pushed config until the next gatewayctl push.
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""

resources: {}
# limits:
#   cpu: 500m
#   memory: 256Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: envoy-perf-gateway-config-server.jecklgamis.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: envoy-perf-gateway-config-server-tls
      hosts:
        - envoy-perf-gateway-config-server.jecklgamis.com

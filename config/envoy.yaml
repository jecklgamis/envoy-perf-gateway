admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

node:
  cluster: envoy-perf-gateway
  id: local

# Required for POST /runtime_modify (used by `gatewayctl fault ...`) to be
# accepted - without an admin layer Envoy refuses with 503 "No admin layer
# specified", even though the runtime keys referenced by the fault filter
# are otherwise valid.
layered_runtime:
  layers:
    - name: admin
      admin_layer: {}

# Clusters (CDS) and listeners (LDS) are loaded dynamically from files that
# Envoy watches via inotify (see watched_directory). This is NOT xDS over
# gRPC/REST - there is no control-plane process. `gatewayctl` renders
# rendered/cds.yaml and rendered/lds.yaml from values.yaml and distributes
# them (HTTP or S3); the fetcher binary atomically swaps them in here;
# Envoy picks up the change and hot-reloads with no restart and no dropped
# connections.
dynamic_resources:
  cds_config:
    resource_api_version: V3
    path_config_source:
      path: /etc/envoy/dynamic/cds.yaml
      watched_directory:
        path: /etc/envoy/dynamic
  lds_config:
    resource_api_version: V3
    path_config_source:
      path: /etc/envoy/dynamic/lds.yaml
      watched_directory:
        path: /etc/envoy/dynamic

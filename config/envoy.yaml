admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

node:
  cluster: envoy-perf-gateway
  id: local

# Two runtime layers, applied in order (later overrides earlier):
#   1. disk  - the persisted baseline. `gatewayctl fault abort|delay` write
#      key files here via the same config_server/S3 -> fetcher -> inotify
#      pipeline used for cds.yaml/lds.yaml, so every replica of the gateway
#      converges on the same fault state, and it survives restarts.
#   2. admin - required for POST /runtime_modify (an ad-hoc, single-pod,
#      in-memory override for a quick live test) to be accepted at all -
#      without it Envoy refuses with 503 "No admin layer specified", even
#      though the runtime keys referenced by the fault filter are otherwise
#      valid. Placed last so an admin override always wins over the disk
#      baseline until Envoy restarts.
layered_runtime:
  layers:
    - name: disk
      disk_layer:
        symlink_root: /etc/envoy/dynamic/runtime
        subdirectory: current
    - name: admin
      admin_layer: {}

# Clusters (CDS) and listeners (LDS) are loaded dynamically from files that
# Envoy watches via inotify (see watched_directory). This is NOT xDS over
# gRPC/REST - there is no control-plane process. `gatewayctl` renders
# rendered/cds.yaml and rendered/lds.yaml from values.yaml and distributes
# them (HTTP or S3); the fetcher binary atomically swaps them in here;
# Envoy picks up the change and hot-reloads with no restart and no dropped
# connections.
dynamic_resources:
  cds_config:
    resource_api_version: V3
    path_config_source:
      path: /etc/envoy/dynamic/cds.yaml
      watched_directory:
        path: /etc/envoy/dynamic
  lds_config:
    resource_api_version: V3
    path_config_source:
      path: /etc/envoy/dynamic/lds.yaml
      watched_directory:
        path: /etc/envoy/dynamic
